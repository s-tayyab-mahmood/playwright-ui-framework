name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

jobs:
  test:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, which Playwright's system deps may not support yet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          # the login "setup" project runs on Chromium, so every job needs Chromium too
          - project: firefox
            browser: chromium firefox
          - project: webkit
            browser: chromium webkit
          - project: mobile-chrome
            browser: chromium
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Only the browser this job needs - installing all three is slow and occasionally hung for 30 minutes
      - name: Install browsers (${{ matrix.browser }})
        timeout-minutes: 8
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
